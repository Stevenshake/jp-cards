<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Карточки">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>Японские карточки</title>
</head>
<body>
  <!-- Экран уроков -->
  <section id="lessons-screen" class="screen">
    <header><h1>Уроки</h1></header>
    <div id="lessons-list" class="lessons-list"></div>
  </section>

  <!-- Экран сессии -->
  <section id="session-screen" class="screen hidden">
    <header>
      <button id="exit-btn" class="btn-text" type="button">← Выйти</button>
      <span id="progress" class="progress"></span>
    </header>

    <div class="card-area">
      <div id="card" class="card">
        <div class="card-inner">
          <div class="card-face card-front">
            <div id="front-text" class="card-text"></div>
          </div>
          <div class="card-face card-back">
            <div id="back-text" class="card-text"></div>
            <div id="reading-text" class="card-reading"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="dont-know-btn" class="btn btn-no" type="button">Не знаю</button>
      <button id="know-btn" class="btn btn-yes" type="button">Знаю</button>
    </div>
  </section>

  <!-- Экран завершения -->
  <section id="done-screen" class="screen hidden">
    <h2>Сессия завершена</h2>
    <p id="done-text"></p>
    <button id="done-btn" class="btn btn-yes" type="button">К урокам</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
